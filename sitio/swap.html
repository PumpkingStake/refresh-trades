<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🐋 WHALECOIN · Swap</title>
<link rel="icon" href="whale.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<style>
  :root{
    --ocean-deep:#0a1a2e;
    --ocean-mid:#123b5e;
    --ocean-surface:#48b5c2;
    --coral:#ff6b6b;
    --seafoam:#7fdbca;
    --gold:#ffd93d;
    --white:#ffffff;
    --text-soft:#c8dbe8;
    --text-dim:#7a9bb5;
    --line:rgba(127,219,202,0.14);
    --font-display:'Orbitron','Inter',sans-serif;
    --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{ overflow-x:hidden; }
  html,body{ height:100%; }
  body{
    background:
      radial-gradient(ellipse 900px 600px at 22% -5%, rgba(72,181,194,0.14), transparent 60%),
      radial-gradient(ellipse 700px 500px at 85% 15%, rgba(255,217,61,0.05), transparent 55%),
      var(--ocean-deep);
    color:var(--white);
    font-family:var(--font-sans);
    min-height:100vh;
    padding:36px 24px 60px;
    position:relative;
    overflow-x:hidden;
  }

  /* ambient bubbles, consistent with the rest of the site */
  .bubbles{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .bubble{
    position:absolute; bottom:-40px; border-radius:50%;
    background:radial-gradient(circle at 30% 30%, rgba(127,219,202,0.30), rgba(127,219,202,0.04) 70%);
    animation:bubbleRise linear infinite;
  }
  @keyframes bubbleRise{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    10%{ opacity:.55; }
    90%{ opacity:.25; }
    100%{ transform:translateY(-110vh) translateX(var(--drift,20px)); opacity:0; }
  }

  .swap-page{
    position:relative;
    z-index:1;
    width:100%;
    max-width:1400px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:26px;
  }

  .swap-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:14px;
    padding-bottom:22px;
    border-bottom:1px solid var(--line);
  }
  .swap-header-left{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .swap-header img{
    height:46px; width:46px; border-radius:50%;
    box-shadow:0 0 0 2px rgba(127,219,202,0.3), 0 0 24px rgba(72,181,194,0.35);
  }
  .swap-header h1{
    font-family:var(--font-display);
    font-weight:800;
    font-size:21px;
    letter-spacing:-0.01em;
    background:linear-gradient(100deg, var(--white) 40%, var(--seafoam));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .swap-header p{
    color:var(--text-dim);
    font-size:13px;
    margin-top:3px;
  }
  .back-link{
    font-size:13px;
    color:var(--text-dim);
    display:flex;
    align-items:center;
    gap:6px;
    padding:8px 14px;
    border-radius:100px;
    border:1px solid var(--line);
    transition:color .15s ease, border-color .15s ease, background .15s ease;
  }
  .back-link:hover{ color:var(--seafoam); border-color:rgba(127,219,202,0.4); background:rgba(127,219,202,0.06); }

  /* signature element: a slow-drifting gradient aura ring around the swap panel */
  .swap-shell-wrap{
    position:relative;
    border-radius:26px;
    padding:2px;
    background:linear-gradient(120deg, rgba(127,219,202,0.55), rgba(72,181,194,0.15) 35%, rgba(255,217,61,0.35) 65%, rgba(127,219,202,0.55));
    background-size:300% 300%;
    animation:auraDrift 14s ease infinite;
    box-shadow:0 30px 80px rgba(0,0,0,0.45);
  }
  @keyframes auraDrift{
    0%{ background-position:0% 50%; }
    50%{ background-position:100% 50%; }
    100%{ background-position:0% 50%; }
  }
  .swap-shell{
    position:relative;
    width:100%;
    background:
      radial-gradient(ellipse 600px 400px at 50% 0%, rgba(72,181,194,0.10), transparent 60%),
      rgba(10,26,46,0.92);
    border-radius:24px;
    padding:22px;
    min-height:640px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    backdrop-filter:blur(6px);
  }
  .swap-frames{
    position:relative;
    width:100%;
    max-width:1250px;
    height:900px;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,0.3);
  }
  .swap-frame-slot{
    position:absolute;
    inset:0;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transform:scale(0.985);
    transition:opacity .28s cubic-bezier(.4,0,.2,1), transform .28s cubic-bezier(.4,0,.2,1), visibility .28s;
  }
  .swap-frame-slot.active{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
    transform:scale(1);
  }
  .dh-frame{
    width:100%;
    height:100%;
    border:none;
    display:block;
    background:transparent;
  }
  .swap-loading{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    color:var(--text-dim);
    font-size:13px;
    background:rgba(10,26,46,0.92);
    transition:opacity .2s ease;
    z-index:2;
  }
  .swap-loading.hidden{ opacity:0; pointer-events:none; }
  .spinner{
    width:22px; height:22px;
    border:3px solid rgba(127,219,202,0.2);
    border-top-color:var(--seafoam);
    border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .swap-footnote{
    font-size:11.5px;
    color:var(--text-dim);
    text-align:center;
  }
  .swap-footnote a{ color:var(--seafoam); text-decoration:none; }
  .swap-footnote a:hover{ text-decoration:underline; }

  .swap-mobile-tabs{ display:none; }

  /* wallet status strip: reflects the app-wide connection, not the widget's own connect state */
  .wallet-status{
    display:flex; align-items:center; gap:10px;
    flex-wrap:wrap;
    padding:10px 16px;
    border-radius:100px;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.02);
    font-size:12.5px;
    color:var(--text-dim);
  }
  .wallet-status .ws-dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--text-dim);
    flex-shrink:0;
  }
  .wallet-status.connected .ws-dot{ background:var(--seafoam); box-shadow:0 0 6px rgba(127,219,202,0.7); }
  .wallet-status .ws-main{ color:var(--white); font-weight:700; }
  .wallet-status .ws-note{ color:var(--text-dim); }
  .wallet-status .ws-note i{ color:var(--gold); margin-right:4px; }

  @media(max-width:1300px){
    .swap-frames{ height:820px; }
  }
  @media(max-width:720px){
    body{ padding:16px 8px 32px; }
    .swap-header{ padding-bottom:16px; gap:10px; }
    .swap-header img{ height:38px; width:38px; }
    .swap-header h1{ font-size:18px; }
    .swap-header p{ font-size:12px; }
    .swap-shell-wrap{ border-radius:18px; }
    .swap-shell{
      padding:6px;
      min-height:auto;
      border-radius:16px;
    }
    .swap-frames{
      width:100%;
      max-width:none;
      height:calc(100svh - 230px);
      min-height:560px;
      max-height:820px;
      border-radius:10px;
    }

    .swap-mobile-tabs{
      display:flex;
      position:relative;
      gap:6px;
      margin:10px 6px 0;
      padding:4px;
      border-radius:14px;
      background:rgba(18,59,94,0.35);
      border:1px solid var(--line);
    }
    .smtab-indicator{
      position:absolute;
      top:4px; left:4px;
      height:calc(100% - 8px);
      width:calc(50% - 6px);
      border-radius:11px;
      background:linear-gradient(135deg, rgba(127,219,202,0.28), rgba(72,181,194,0.16));
      box-shadow:inset 0 0 0 1px rgba(127,219,202,0.4);
      transition:transform .28s cubic-bezier(.4,0,.2,1);
      pointer-events:none;
    }
    .smtab{
      position:relative;
      z-index:1;
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:7px;
      padding:11px 8px;
      border-radius:11px;
      border:none;
      background:transparent;
      color:var(--text-dim);
      font-family:var(--font-sans);
      font-size:13.5px;
      font-weight:700;
      cursor:pointer;
      transition:color .2s ease, transform .12s ease;
      -webkit-tap-highlight-color:transparent;
    }
    .smtab svg{ width:16px; height:16px; flex-shrink:0; }
    .smtab:active{ transform:scale(0.95); }
    .smtab.active{ color:var(--white); }
  }
  @media(max-width:420px){
    .swap-header{ flex-direction:column; align-items:flex-start; }
    .swap-shell{ padding:4px; }
    .swap-frames{ height:calc(100svh - 250px); min-height:520px; }
  }

  @media (prefers-reduced-motion: reduce){
    .bubble{ animation:none; display:none; }
    .swap-shell-wrap{ animation:none; }
  }
</style>
</head>
<body>

<div class="bubbles" id="bubbles"></div>

<div class="swap-page">
  <div class="swap-header">
    <div class="swap-header-left">
      <img src="whale.png" alt="WHALE" onerror="this.style.display='none'" />
      <div>
        <h1>Swap $WHALECOIN</h1>
        <p>Best price across Cardano DEXs, powered by DexHunter.</p>
      </div>
    </div>
  </div>

  <div class="wallet-status" id="walletStatus">
    <span class="ws-dot"></span>
    <span class="ws-main" id="wsMain">Wallet not connected</span>
    <span class="ws-note" id="wsNote"></span>
  </div>

  <div class="swap-shell-wrap">
    <div class="swap-shell">
      <div class="swap-frames" id="swapFrames">
        <div class="swap-frame-slot active" data-slot="swap">
          <div class="swap-loading" data-loading-for="swap"><div class="spinner"></div>Loading swap…</div>
          <iframe class="dh-frame" data-frame="swap" title="DexHunter Swap Widget" allow="clipboard-read; clipboard-write"></iframe>
        </div>
        <div class="swap-frame-slot" data-slot="market">
          <div class="swap-loading" data-loading-for="market"><div class="spinner"></div>Loading market…</div>
          <iframe class="dh-frame" data-frame="market" title="DexHunter Market" allow="clipboard-read; clipboard-write"></iframe>
        </div>
      </div>
    </div>
    <div class="swap-mobile-tabs" id="swapMobileTabs">
      <div class="smtab-indicator" id="smtabIndicator"></div>
      <button class="smtab active" data-mode="swap" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        <span>Swap</span>
      </button>
      <button class="smtab" data-mode="market" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>
        <span>Market</span>
      </button>
    </div>
  </div>

  <div class="swap-footnote">
    Trouble loading? <a href="https://swap.dexhunter.io" target="_blank" rel="noopener">Open DexHunter directly →</a>
  </div>
</div>

<script src="wallet-bridge.js"></script>
<script>
(function () {
  var wsEl = document.getElementById('walletStatus');
  var wsMain = document.getElementById('wsMain');
  var wsNote = document.getElementById('wsNote');

  function renderWalletStatus(state) {
    if (!wsEl || !window.WalletBridge) return;
    wsEl.classList.toggle('connected', !!state.connected);
    if (state.connected) {
      var w = WalletBridge.WALLETS.find(function (w) { return w.key === state.wallet; });
      wsMain.textContent = (w ? w.name : state.wallet) + ' connected'
        + (state.address ? ' · ' + WalletBridge.truncate(state.address) : '');
    } else {
      wsMain.textContent = 'Wallet not connected';
    }
  }

  if (window.WalletBridge) {
    renderWalletStatus(WalletBridge.getState());
    WalletBridge.attemptSilentReconnect().then(renderWalletStatus);
    WalletBridge.onChange(renderWalletStatus);
  }
})();
</script>
<script>
(function () {
  var isMobile = window.innerWidth <= 720;
  var availableWidth = Math.max(window.innerWidth - 16, 280);
  var widgetWidth = Math.min(400, availableWidth);

  var baseParams = '?orderTypes=%5B%22SWAP%22%2C%22LIMIT%22%5D'
    + '&defaultTokenIn='
    + '&defaultTokenOut=326c008488f7b9a8c6fbe9e4ab2c8d1ba8d7f33284970f3dd2d5142d5748414c45434f494e'
    + '&colors=%7B%22mainText%22%3A%22%23E8F4F8%22%2C%22subText%22%3A%22%237A9BB5%22%2C%22background%22%3A%22%230A1A2E%22%2C%22containers%22%3A%22%23123B5E%22%2C%22buttonText%22%3A%22%23FFFFFF%22%2C%22accent%22%3A%22%2348B5C2%22%7D'
    + '&partnerName=Whalecoin'
    + '&partnerCode=whalecoin61646472317178337a3965756b3837746d337763706e797067716b7638387972666a6a327934346c706b3435387734393667683476787471687336667a6c7679306b7864377867326e746c393638777132726b366d7237303064706e74663034736838306b6136da39a3ee5e6b4b0d3255bfef95601890afd80709';

  function frameUrl(mode) {
    var url = 'https://swap.dexhunter.io' + baseParams;
    if (!isMobile) {
      return url + '&showChart=true&showOrders=true&swapWidth=400';
    }
    if (mode === 'market') {
      return url + '&showChart=true&showOrders=true&chartWidth=' + widgetWidth + '&ordersWidth=' + widgetWidth + '&swapWidth=' + widgetWidth;
    }
    return url + '&swapWidth=' + widgetWidth;
  }

  var loaded = {};
  function ensureLoaded(mode) {
    if (loaded[mode]) return;
    var frameEl = document.querySelector('.dh-frame[data-frame="' + mode + '"]');
    if (!frameEl) return;
    loaded[mode] = true;
    frameEl.addEventListener('load', function () {
      var loadingEl = document.querySelector('.swap-loading[data-loading-for="' + mode + '"]');
      if (loadingEl) loadingEl.classList.add('hidden');
    }, { once: true });
    frameEl.src = frameUrl(mode);
  }

  var slots = document.querySelectorAll('.swap-frame-slot');
  function activate(mode) {
    slots.forEach(function (slot) {
      slot.classList.toggle('active', slot.dataset.slot === mode);
    });
    ensureLoaded(mode);
  }

  activate('swap');
  if (isMobile) {
    var idle = window.requestIdleCallback || function (cb) { return setTimeout(cb, 1200); };
    idle(function () { ensureLoaded('market'); });
  }

  var mobileTabs = document.getElementById('swapMobileTabs');
  var indicator = document.getElementById('smtabIndicator');
  if (mobileTabs) {
    var buttons = Array.prototype.slice.call(mobileTabs.querySelectorAll('.smtab'));
    buttons.forEach(function (btn, i) {
      btn.addEventListener('click', function () {
        if (btn.classList.contains('active')) return;
        buttons.forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        if (indicator) indicator.style.transform = 'translateX(' + (i * 100) + '%)';
        if (navigator.vibrate) { try { navigator.vibrate(8); } catch (e) {} }
        activate(btn.dataset.mode);
      });
    });
  }

  function spawnBubbles(){
    var container = document.getElementById('bubbles');
    if (!container) return;
    var COUNT = 16;
    for (var i = 0; i < COUNT; i++) {
      var b = document.createElement('div');
      b.className = 'bubble';
      var size = 6 + Math.random() * 18;
      var left = Math.random() * 100;
      var duration = 14 + Math.random() * 16;
      var delay = Math.random() * -30;
      var drift = (Math.random() * 60 - 30) + 'px';
      b.style.width = size + 'px';
      b.style.height = size + 'px';
      b.style.left = left + '%';
      b.style.setProperty('--drift', drift);
      b.style.animationDuration = duration + 's';
      b.style.animationDelay = delay + 's';
      container.appendChild(b);
    }
  }
  spawnBubbles();
})();
</script>

</body>
</html>
