<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WHALECOIN App · Dashboard</title>
<link rel="icon" href="whale.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<style>
  :root{
    --ocean-deep:#0a1a2e;
    --ocean-mid:#123b5e;
    --ocean-surface:#48b5c2;
    --coral:#ff6b6b;
    --seafoam:#7fdbca;
    --gold:#ffd93d;
    --white:#ffffff;
    --text-soft:#c8dbe8;
    --text-dim:#7a9bb5;
    --line:rgba(127,219,202,0.14);
    --font-display:'Orbitron','Inter',sans-serif;
    --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    background:var(--ocean-deep);
    color:var(--white);
    font-family:var(--font-sans);
    display:flex;
    overflow:hidden;
  }
  a{ color:inherit; text-decoration:none; }

  .sidebar{
    width:232px;
    flex-shrink:0;
    background:rgba(10,26,46,0.9);
    display:flex;
    flex-direction:column;
    padding:20px 14px;
    height:100vh;
    overflow-y:auto;
  }
  .sb-brand{
    display:flex; align-items:center; gap:10px;
    padding:6px 8px 20px;
    border-bottom:1px solid var(--line);
    margin-bottom:16px;
  }
  .sb-brand img{ height:30px; width:30px; border-radius:50%; box-shadow:0 0 0 2px rgba(72,181,194,0.35); }
  .sb-brand .t{ font-family:var(--font-display); font-weight:800; font-size:14.5px; display:block; }
  .sb-brand .s{ font-size:10.5px; color:var(--text-dim); display:block; }

  .sb-section-label{
    font-size:10.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
    color:var(--text-dim); padding:14px 10px 8px;
  }

  .tab{
    display:flex; align-items:center; gap:12px;
    padding:11px 12px;
    border-radius:10px;
    font-size:14px; font-weight:600;
    color:var(--text-soft);
    cursor:pointer;
    margin-bottom:2px;
    position:relative;
    transition:background .15s ease, color .15s ease;
  }
  .tab .ic{ width:18px; text-align:center; font-size:14.5px; }
  .tab .lbl{ flex:1; }
  .tab:hover{ background:rgba(255,255,255,0.04); color:var(--white); }
  .tab.active{
    background:linear-gradient(135deg, rgba(127,219,202,0.14), rgba(72,181,194,0.06));
    color:var(--white);
    box-shadow:inset 0 0 0 1px rgba(127,219,202,0.25);
  }
  .tab.active .ic{ color:var(--seafoam); }
  .tab .dot{ width:6px; height:6px; border-radius:50%; background:var(--seafoam); animation:blip 1.8s infinite; }
  @keyframes blip{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  .tab.locked{ cursor:default; opacity:.55; }
  .tab.locked:hover{ background:none; color:var(--text-soft); }
  .tab.locked .ic{ color:var(--text-dim); }
  .tab-tag{
    font-size:9px; font-weight:800; letter-spacing:.05em; text-transform:uppercase;
    background:rgba(255,217,61,0.15); color:var(--gold);
    padding:2px 6px; border-radius:100px;
  }

  .sb-footer{
    margin-top:auto;
    padding-top:16px;
    border-top:1px solid var(--line);
  }
  .sb-back{
    display:flex; align-items:center; gap:10px;
    font-size:13px; color:var(--text-dim);
    padding:9px 10px; border-radius:8px;
  }
  .sb-back:hover{ color:var(--white); background:rgba(255,255,255,0.03); }
  .sb-social{
    display:flex; gap:8px; padding:10px 8px 0;
  }
  .sb-social a{
    width:30px; height:30px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line); color:var(--text-soft); font-size:13px;
  }
  .sb-social a:hover{ border-color:var(--seafoam); color:var(--seafoam); }

  .mobile-bar{
    display:none;
    align-items:center; justify-content:space-between;
    padding:12px 16px;
    background:rgba(10,26,46,0.95);
    border-bottom:1px solid var(--line);
    position:fixed; top:0; left:0; right:0; z-index:100;
  }
  .mobile-bar .brand{ display:flex; align-items:center; gap:8px; font-family:var(--font-display); font-weight:800; font-size:14px; }
  .mobile-bar img{ height:26px; width:26px; border-radius:50%; }
  .mobile-toggle{ background:none; border:1px solid var(--line); color:var(--white); width:36px; height:36px; border-radius:8px; font-size:15px; }

  .sb-backdrop{
    display:none;
    position:fixed; inset:0; z-index:98;
    background:rgba(0,0,0,0.5);
    opacity:0;
    transition:opacity .2s ease;
  }
  .sb-backdrop.show{ display:block; opacity:1; }

  @media(max-width:880px){
    .mobile-bar{ display:flex; }
    .sidebar{
      position:fixed; top:0; left:0; bottom:0; z-index:99;
      width:232px;
      max-width:82vw;
      transform:translateX(-100%);
      transition:transform .2s ease;
      padding-top:70px;
      box-shadow:0 0 40px rgba(0,0,0,0.4);
    }
    .sidebar.open{ transform:translateX(0); }
    .main{ padding-top:56px !important; }
    .tab{ padding:13px 12px; font-size:14.5px; }
  }

  @media(max-width:360px){
    .mobile-bar .brand{ font-size:12.5px; }
    .toast{ left:12px; right:12px; transform:translateY(20px); width:auto; }
    .toast.show{ transform:translateY(0); }
  }

  .main{
    flex:1;
    height:100vh;
    position:relative;
    overflow:hidden;
  }
  .view{
    position:absolute; inset:0;
    display:none;
  }
  .view.active{ display:block; }
  .view iframe{
    width:100%; height:100%;
    border:none;
    display:block;
  }
  .view-loading{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:14px;
    color:var(--text-dim);
    font-size:13px;
    background:var(--ocean-deep);
  }
  .spinner{
    width:30px; height:30px;
    border:3px solid rgba(127,219,202,0.2);
    border-top-color:var(--seafoam);
    border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .locked-view{
    height:100%; display:flex; align-items:center; justify-content:center;
    flex-direction:column; text-align:center; gap:16px; padding:20px;
    background:
      radial-gradient(ellipse 700px 500px at 30% 20%, rgba(72,181,194,0.10), transparent 60%),
      var(--ocean-deep);
  }
  .locked-view .icon{ font-size:44px; }
  .locked-view h2{ font-family:var(--font-display); font-size:22px; font-weight:800; }
  .locked-view p{ color:var(--text-dim); max-width:380px; font-size:14.5px; }
  .locked-view .btn{
    display:inline-flex; align-items:center; gap:8px;
    background:linear-gradient(135deg, var(--seafoam), var(--ocean-surface));
    color:var(--ocean-deep); font-weight:700; font-size:13.5px;
    padding:11px 20px; border-radius:100px; margin-top:6px;
  }

  .wallet-chip{
    display:flex; align-items:center; gap:9px;
    padding:10px 12px;
    border-radius:10px;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.02);
    cursor:pointer;
    margin-bottom:6px;
    transition:border-color .15s ease, background .15s ease;
  }
  .wallet-chip:hover{ border-color:rgba(127,219,202,0.4); background:rgba(127,219,202,0.05); }
  .wallet-chip .wc-dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--text-dim);
    flex-shrink:0;
  }
  .wallet-chip.connected .wc-dot{ background:var(--seafoam); box-shadow:0 0 6px rgba(127,219,202,0.7); }
  .wallet-chip .wc-text{ flex:1; min-width:0; }
  .wallet-chip .wc-label{ font-size:12.5px; font-weight:700; color:var(--white); }
  .wallet-chip .wc-sub{ font-size:10.5px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .wallet-chip .wc-ic{ font-size:13px; color:var(--text-dim); }
  .wallet-chip.connected .wc-ic{ color:var(--seafoam); }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ocean-mid);
    border:1px solid var(--line);
    padding:12px 18px; border-radius:10px;
    font-size:13.5px; font-weight:600;
    display:flex; align-items:center; gap:10px;
    opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:200;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast .ic{ color:var(--gold); }
</style>
</head>
<body>

<div class="mobile-bar">
  <div class="brand"><img src="whale.png" onerror="this.style.display='none'" alt="" /> WHALECOIN</div>
  <button class="mobile-toggle" id="mobileToggle"><i class="fa-solid fa-bars"></i></button>
</div>

<div class="sb-backdrop" id="sbBackdrop"></div>

<aside class="sidebar" id="sidebar">
  <a href="index.html" class="sb-brand">
    <img src="whale.png" alt="WHALE" onerror="this.style.display='none'" />
    <div>
      <span class="t">WHALECOIN</span>
      <span class="s">App</span>
    </div>
  </a>

  <div class="wallet-chip" id="walletChip">
    <span class="wc-dot"></span>
    <span class="wc-text">
      <span class="wc-label" id="wcLabel">Connect Wallet</span>
      <span class="wc-sub" id="wcSub"></span>
    </span>
    <span class="wc-ic"><i class="fa-solid fa-plug" id="wcIcon"></i></span>
  </div>

  <div class="sb-section-label">Live</div>
  <div class="tab active" data-view="dashboard">
    <span class="ic"><i class="fa-solid fa-gauge-high"></i></span>
    <span class="lbl">Dashboard</span>
    <span class="dot"></span>
  </div>
    <div class="tab" data-view="swap">
    <span class="ic"><i class="fa-solid fa-water"></i></span>
    <span class="lbl">Swap</span>
    <span class="dot"></span>
  </div>

  
  <div class="tab" data-view="portfolio">
    <span class="ic"><i class="fa-solid fa-wallet"></i></span>
    <span class="lbl">Portfolio</span>
    <span class="dot"></span>
  </div>

  <div class="sb-section-label">Coming soon</div>
  <div class="tab locked" data-locked="Perps">
    <span class="ic"><i class="fa-solid fa-bolt"></i></span>
    <span class="lbl">Perps</span>
    <span class="tab-tag">Soon</span>
  </div>
  <div class="tab locked" data-locked="Pools">
    <span class="ic"><i class="fa-solid fa-droplet"></i></span>
    <span class="lbl">Liquidity Pools</span>
    <span class="tab-tag">Soon</span>
  </div>

  <div class="tab locked" data-locked="Staking">
    <span class="ic"><i class="fa-solid fa-layer-group"></i></span>
    <span class="lbl">Staking</span>
    <span class="tab-tag">Soon</span>
  </div>

  <div class="sb-footer">
    <a href="index.html" class="sb-back"><i class="fa-solid fa-arrow-left"></i> Back to hub</a>
    <div class="sb-social">
      <a href="https://x.com/WhalecoinADA" target="_blank" rel="noopener" aria-label="Twitter/X">𝕏</a>
      <a href="https://cexplorer.io/asset/asset1f8kvumj06qf7e6ve79ymenaqr3q7xxeu7lcsrt" target="_blank" rel="noopener" aria-label="Cexplorer"><i class="fa-solid fa-magnifying-glass"></i></a>
    </div>
  </div>
</aside>

<main class="main">
  <div class="view active" id="view-dashboard">
    <div class="view-loading" id="loading-dashboard"><div class="spinner"></div>Loading dashboard…</div>
    <iframe data-src="dashboard.html" title="WHALECOIN Dashboard"></iframe>
  </div>

    <div class="view" id="view-swap">
    <iframe data-src="swap.html" title="Swap"></iframe>
  </div>

  <div class="view" id="view-trades">
    <div class="view-loading" id="loading-trades"><div class="spinner"></div>Loading reef trades…</div>
    <iframe data-src="trades.html" title="WHALECOIN Reef Trades"></iframe>
  </div>

  <div class="view" id="view-portfolio">
    <div class="view-loading" id="loading-portfolio"><div class="spinner"></div>Loading portfolio…</div>
    <iframe data-src="portfolio.html" title="WHALECOIN Portfolio"></iframe>
  </div>

</main>

<div class="toast" id="toast"><span class="ic"><i class="fa-solid fa-lock"></i></span><span id="toastMsg"></span></div>
<script src="wallet-bridge.js"></script>

<script>
  const tabs = document.querySelectorAll('.tab[data-view]');
  const lockedTabs = document.querySelectorAll('.tab[data-locked]');
  const views = document.querySelectorAll('.view');
  const sidebar = document.getElementById('sidebar');
  const toast = document.getElementById('toast');
  const toastMsg = document.getElementById('toastMsg');
  let toastTimer = null;

  function showToast(msg){
    toastMsg.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
  }

  function loadIframeIfNeeded(viewEl){
    const iframe = viewEl.querySelector('iframe');
    if (iframe && !iframe.src && iframe.dataset.src){
      iframe.src = iframe.dataset.src;
      iframe.addEventListener('load', () => {
        const loading = viewEl.querySelector('.view-loading');
        if (loading) loading.style.display = 'none';
      });
    }
  }

  function activateView(name){
    tabs.forEach(t => t.classList.toggle('active', t.dataset.view === name));
    views.forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
    const target = document.getElementById('view-' + name);
    if (target) loadIframeIfNeeded(target);
    history.replaceState(null, '', '#' + name);
    setSidebarOpen(false);
  }

  tabs.forEach(tab => {
    tab.addEventListener('click', () => activateView(tab.dataset.view));
  });

  lockedTabs.forEach(tab => {
    tab.addEventListener('click', () => {
      showToast(tab.dataset.locked + ' is coming soon — stay tuned.');
    });
  });

  const mobileToggle = document.getElementById('mobileToggle');
  const sbBackdrop = document.getElementById('sbBackdrop');

  function setSidebarOpen(open){
    sidebar.classList.toggle('open', open);
    sbBackdrop.classList.toggle('show', open);
    mobileToggle.innerHTML = open
      ? '<i class="fa-solid fa-xmark"></i>'
      : '<i class="fa-solid fa-bars"></i>';
  }

  mobileToggle.addEventListener('click', () => {
    setSidebarOpen(!sidebar.classList.contains('open'));
  });
  sbBackdrop.addEventListener('click', () => setSidebarOpen(false));

  const initial = (location.hash || '#dashboard').replace('#', '');
  const lockedInitial = { staking: 'Staking', portfolio: 'Portfolio', pools: 'Pools', perps: 'Perps' };
  if (lockedInitial[initial]) {
    activateView('dashboard');
    showToast(lockedInitial[initial] + ' is coming soon — stay tuned.');
  } else {
    const validInitial = ['dashboard','trades','swap','portfolio'].includes(initial) ? initial : 'dashboard';
    activateView(validInitial);
  }
  const walletChip = document.getElementById('walletChip');
  const wcLabel = document.getElementById('wcLabel');
  const wcSub = document.getElementById('wcSub');
  const wcIcon = document.getElementById('wcIcon');

  function renderChip(state){
    walletChip.classList.toggle('connected', !!state.connected);
    if (state.connected){
      const w = WalletBridge.WALLETS.find(w => w.key === state.wallet);
      wcLabel.textContent = (w ? w.name : state.wallet) + ' connected';
      wcSub.textContent = state.address ? WalletBridge.truncate(state.address) : 'Connected';
      wcIcon.className = 'fa-solid fa-circle-check';
    } else {
      wcLabel.textContent = 'Connect Wallet';
      wcSub.textContent = '';
      wcIcon.className = 'fa-solid fa-plug';
    }
  }

  const walletPicker = WalletBridge.createPicker({
    subtitle: 'Lace, Vespr and Eternl are supported. Your connection stays active across Dashboard, Swap, Trades and Portfolio.',
    onError: (err) => showToast(err && err.message ? err.message : 'Could not connect wallet.')
  });
  walletChip.addEventListener('click', () => walletPicker.open());

  renderChip(WalletBridge.getState());
  WalletBridge.attemptSilentReconnect().then(renderChip);
  WalletBridge.onChange(renderChip);

</script>

</body>
</html>
